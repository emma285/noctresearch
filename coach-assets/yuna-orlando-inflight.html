<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>윤이나 · 시차_10월 올랜도 (기내)</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
*{box-sizing:border-box}
body{font-family:'Pretendard',system-ui,sans-serif;background:#F4F6F8;color:#0D1B2A;margin:0;padding:10px 8px 24px}
.wrap{max-width:430px;margin:0 auto}
.ttl{font-size:16px;font-weight:800;margin:4px 2px 10px;color:#0D1B2A}
.calwrap{border:1px solid #E3E8EC;border-radius:14px;background:#fff;overflow:hidden}
.cal{display:grid;grid-template-columns:32px repeat(3,minmax(0,1fr));gap:0;background:#fff;width:100%}
.gut{border-right:1px solid #EEF1F4;background:#fff}
.gut .gtop{border-bottom:1px solid #EEF1F4;background:#FAFBFC}
.gutgrid{position:relative}
.hr{position:absolute;left:0;right:4px;transform:translateY(-50%);text-align:right;font-size:9px;color:#9aa6b2;font-weight:600}
.col{border-right:1px solid #EEF1F4;min-width:0}.col:last-child{border-right:none}
.ch{padding:6px 5px;border-bottom:1px solid #EEF1F4;background:#FAFBFC;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.cd{font-size:13px;font-weight:800;width:100%}.cd span{font-size:11px;color:#9aa6b2;margin-left:2px}
.tz{display:inline-block;font-size:8.5px;font-weight:800;padding:1px 6px;border-radius:5px}
.tz.kst{color:#20506A;background:#e8f2f8}
.tz.shift{color:#a8483b;background:#F9DED8}
.ct{font-size:8.5px;font-weight:800;color:#20506A;background:#e8f2f8;border-radius:5px;padding:1px 7px;display:inline-block}
.ct.turn{color:#C13E80;background:rgba(236,107,168,.14)}
.grid{position:relative}
.hl{position:absolute;left:0;right:0;height:1px;background:#F2F4F6}
.band{position:absolute;left:0;right:0;z-index:0;background:rgba(180,140,0,.10);border-top:1px dashed rgba(180,140,0,.45);border-bottom:1px dashed rgba(180,140,0,.45)}
.band span{position:absolute;top:2px;left:4px;right:4px;font-size:8px;font-weight:800;color:#8a6d00;background:rgba(255,255,255,.8);padding:0 4px;border-radius:4px;line-height:1.35}
.ev{position:absolute;left:3px;right:3px;z-index:1;border-radius:7px;padding:3px 5px;overflow:visible;font-size:9.5px;line-height:1.3;box-shadow:0 1px 2px rgba(13,27,42,.05)}
.ev .tl{font-weight:800;margin-right:4px}
.ev .nm{font-weight:800}
.ev .sub{font-weight:500;opacity:.85}
.ev.sleep{display:flex;flex-direction:column;padding:5px 6px}
.ev.sleep .nm{font-size:11px}
.ev.sleep .sub{opacity:1;font-size:9px;font-weight:600;color:#e4ebf2;margin-top:1px}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="ttl">시차_10월 올랜도 (기내)</h1>
  <div class="calwrap"><div class="cal" id="cal"></div></div>
</div>

<script>
const PAD = 8, AX0 = 5, AX1 = 30;   // 05:00 → 익일 06:00
const h6 = t => (t >= AX0 ? t : t + 24) - AX0;
const hhmm = t => { t = t % 24; let hh = Math.floor(t), mm = Math.round((t - hh) * 60); if (mm === 60) { hh = (hh + 1) % 24; mm = 0; } return String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0'); };
const COLOR = {
  수면:['#26374A','#e4ebf2'], 식사:['#E4F2E8','#2E7D46'], 커피:['#F6E7CE','#8a5a00'],
  낮잠:['#DCEEF6','#1f5b78'], 이완:['#E7EAEE','#3a4652'], 훈련:['#EEF0FB','#4355B0'],
  비행:['#E3EDF6','#1F5B8A'], 이동:['#EDE9F5','#5A4FA6'],
};
// [start, end, type, 시각라벨, 이름(' · ' 뒤는 보조설명), dashed]
const DAYS = [
  { date:'10/28', dow:'수', tz:{t:'서울 KST · 기내', cls:'kst'}, tag:'출국 · 기내수면',
    bands:[], cards:[
      [6.0,9.4,'이동','','공항 이동 · 가는 길 쪽잠은 참고 기내에서 몰아 자기',true],
      [9.58,11.0,'비행','09:35','이륙 KE7273 · 탑승',false],
      [11.0,12.0,'식사','11:00','기내식 1차(메인) · 먹고 바로 취침 모드',false],
      [12.0,19.0,'수면','12:00','기내 취침 약 7h · 안대·귀마개 · 현지 23:00→06:00',false],
      [19.0,20.0,'비행','19:00','기상·기내빛·물 · 현지 06:00, 다시 안 자기',false],
      [20.0,21.0,'비행','','깨어 있기 · 빛·스트레칭으로 현지 아침 만들기',false],
      [21.0,22.0,'식사','21:00','기내식 2차 (착륙 전 아침) · 현지 08:00',false],
      [22.43,25.33,'이동','22:26','DTW 착륙 · 인천→디트로이트 도착, 환승 대기 후 올랜도행 · 현지 09:26~12:20 · 밖은 아침이에요, 빛 쬐고 낮잠 금지 · 커피 ½잔 OK',true],
      [25.33,27.95,'비행','01:20','DTW→MCO KE3221 · 현지 12:20~14:57 · 깨어 있기, 졸리면 일어나 걷기',false],
    ]},
  { date:'10/28', dow:'수', tz:{t:'올랜도 현지 EDT · −13h', cls:'shift'}, tag:'도착 첫날', turn:true,
    bands:[[16.0,18.0,'☀️ 도착 후 야외빛 (리듬 고정)']], cards:[
      [14.95,15.95,'이동','14:57','MCO 도착 · 밖으로 나가 빛 받기',false],
      [18.5,19.25,'식사','18:30','저녁',false],
      [21.0,22.0,'이완','21:00','버퍼존 · 조명↓·미지근샤워·호흡',false],
      [22.0,30.0,'수면','22:00','취침 22:00 · 약 9h → 07:00 기상 · 낮잠 없이 바로 밤',false],
    ]},
  { date:'10/29', dow:'목', tz:{t:'올랜도 현지 EDT', cls:'shift'}, tag:'현지 1일차',
    bands:[[7.0,7.5,'☀️ 야외 아침 햇빛 (리듬 고정)']], cards:[
      [5.0,7.0,'수면','','기상 07:00',false],
      [7.5,8.25,'식사','07:30','아침 · 햇빛 같이',false],
      [9.0,10.0,'커피','09:00','커피 ½~1잔 · 오후엔 컷',true],
      [13.0,13.75,'낮잠','','졸리면 20분 (옵션)',true],
      [14.0,16.0,'훈련','','훈련·연습 · 시각 미정',true],
      [18.5,19.25,'식사','18:30','저녁',false],
      [21.5,22.5,'이완','21:30','버퍼존 · 조명↓·미지근샤워·호흡',false],
      [22.5,30.0,'수면','22:30','취침 22:30 · 약 8h30 → 07:00 기상',false],
    ]},
];

function render(){
  // 모바일 세로형: 폭은 화면에 맞추고, 1시간 높이는 블록 설명이 다 보이도록 고정
  const cal = document.getElementById('cal');
  const heads = DAYS.map(d => {
    const tzb = d.tz ? `<span class="tz ${d.tz.cls}">${d.tz.t}</span>` : '';
    return `<div class="ch"><span class="cd">${d.date} <span>(${d.dow})</span></span>${tzb}<span class="${d.turn ? 'ct turn' : 'ct'}">${d.tag}</span></div>`;
  });
  cal.innerHTML = `<div class="gut"><div class="gtop"></div></div>` + heads.map(h => `<div class="col">${h}</div>`).join('');
  const headH = Math.max(...[...cal.querySelectorAll('.ch')].map(c => c.offsetHeight));
  const PXH = 48;
  const H = (AX1 - AX0) * PXH + PAD * 2;

  const evHtml = c => {
    const [s,e,t,tl,nm,dash] = c;
    const top = PAD + h6(s)*PXH + 1, hgt = (h6(e)-h6(s))*PXH - 2;
    const [bg,fg] = COLOR[t];
    const border = dash ? ';border:1.5px dashed #b98a3e' : ';border:1px solid rgba(0,0,0,.05)';
    const si = nm.indexOf(' · ');
    const main = si < 0 ? nm : nm.slice(0, si);
    const sub = si < 0 ? '' : nm.slice(si + 3);
    if (t === '수면'){
      const align = s < 12 ? 'flex-end' : 'flex-start';
      const subh = sub ? `<span class="sub">${sub}</span>` : '';
      return `<div class="ev sleep" style="top:${top}px;height:${hgt}px;background:${bg};color:${fg};justify-content:${align}"><span class="nm">${main}</span>${subh}</div>`;
    }
    const tlh = tl ? `<span class="tl">${tl}</span>` : '';
    const subh = sub ? ` <span class="sub">${sub}</span>` : '';
    return `<div class="ev" style="top:${top}px;min-height:${hgt}px;background:${bg};color:${fg}${border}">${tlh}<span class="nm">${main}</span>${subh}</div>`;
  };
  const bandHtml = b => { const [s,e,label] = b; const top = PAD + h6(s)*PXH, hgt = (h6(e)-h6(s))*PXH; return `<div class="band" style="top:${top}px;height:${hgt}px"><span>${label}</span></div>`; };
  let lines = '', gutter = '';
  for (let i = 0; i <= AX1 - AX0; i++){
    lines += `<div class="hl" style="top:${PAD + i*PXH}px"></div>`;
    gutter += `<div class="hr" style="top:${PAD + i*PXH}px">${hhmm(AX0 + i)}</div>`;
  }
  let html = `<div class="gut"><div class="gtop" style="height:${headH}px"></div><div class="gutgrid" style="height:${H}px">${gutter}</div></div>`;
  DAYS.forEach((d, i) => {
    html += `<div class="col">${heads[i].replace('class="ch"', `class="ch" style="height:${headH}px"`)}<div class="grid" style="height:${H}px">${lines}${(d.bands||[]).map(bandHtml).join('')}${d.cards.map(evHtml).join('')}</div></div>`;
  });
  cal.innerHTML = html;
}
render();
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 80); });
</script>
<script id="protocol-targets" type="application/json">
{"name":"올랜도 기내 프로토콜","targets":[
 {"date":"2026-10-28","bed":"현지 22:00","wake":"현지 07:00","label":"올랜도 도착 첫밤"},
 {"date":"2026-10-29","bed":"22:30","wake":"07:00","label":"현지 1일차"}
]}
</script>
</body>
</html>
